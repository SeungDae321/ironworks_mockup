<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다 | 아이언웍스 피트니스</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0f11'/%3E%3Cpath d='M7 13h3v6H7zm15 0h3v6h-3zM11 15h10v2H11z' fill='%23c8f542'/%3E%3C/svg%3E" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  />
  <!-- 404 는 임의의 경로에서 서빙되므로 절대 경로를 쓴다 -->
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .notfound {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }

    .notfound__code {
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--accent);
    }

    .notfound__title {
      margin-top: 18px;
      font-size: clamp(1.3rem, 4vw, 1.9rem);
    }

    .notfound__lead {
      max-width: 420px;
      margin: 14px auto 32px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <p class="notfound__code">404</p>
      <h1 class="notfound__title">이 경로에는 아무것도 없습니다</h1>
      <p class="notfound__lead">
        주소가 바뀌었거나 잘못 입력된 것 같습니다. 운동은 계속되어야 하니 홈으로 돌아가시죠.
      </p>
      <a class="btn btn--primary btn--lg" href="/">홈으로 가기</a>
    </div>
  </main>
</body>
</html>
